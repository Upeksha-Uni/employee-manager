
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 16px;
            background: #f4f6f9;
            color: #222;
        }

        h1, h2 {
            color: #243b64;
        }

        .panel {
            background: white;
            padding: 20px;
            margin-bottom: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #00000010;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button, .button {
            display: inline-block;
            padding: 9px 13px;
            border: none;
            border-radius: 5px;
            background: #243b64;
            color: white;
            cursor: pointer;
            text-decoration: none;
        }

        .danger {
            background: #b42318;
        }

        .message {
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 5px;
            background: #e4f6e9;
        }

        .error {
            color: #b42318;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 11px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #243b64;
            color: white;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<h1>Employee Management System</h1>

<div th:if="${successMessage}" class="message"
     th:text="${successMessage}"></div>

<div th:if="${errorMessage}" class="message error"
     th:text="${errorMessage}"></div>

<section class="panel">
    <h2>Add Employee</h2>

    <form th:action="@{/employees}"
          th:object="${employee}"
          method="post"
          novalidate>

        <div class="form-grid">
            <div>
                <label for="fullName">Full Name</label>
                <input id="fullName" type="text"
                       th:field="*{fullName}">
                <div class="error"
                     th:if="${#fields.hasErrors('fullName')}"
                     th:errors="*{fullName}"></div>
            </div>

            <div>
                <label for="email">Email</label>
                <input id="email" type="text"
                       th:field="*{email}">
                <div class="error"
                     th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}"></div>
            </div>

            <div>
                <label for="phone">Phone (10 digits)</label>
                <input id="phone" type="text"
                       th:field="*{phone}">
                <div class="error"
                     th:if="${#fields.hasErrors('phone')}"
                     th:errors="*{phone}"></div>
            </div>

            <div>
                <label for="department">Department</label>
                <input id="department" type="text"
                       th:field="*{department}">
                <div class="error"
                     th:if="${#fields.hasErrors('department')}"
                     th:errors="*{department}"></div>
            </div>

            <div>
                <label for="salary">Salary</label>
                <input id="salary" type="number"
                       th:field="*{salary}"
                       step="any">
                <div class="error"
                     th:if="${#fields.hasErrors('salary')}"
                     th:errors="*{salary}"></div>
            </div>
        </div>

        <p>
            <button type="submit">Add Employee</button>
        </p>
    </form>
</section>

<section class="panel">
    <h2>Employee List</h2>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.fullName}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.phone}"></td>
                <td th:text="${emp.department}"></td>
                <td th:text="${emp.salary}"></td>

                <td>
                    <a class="button"
                       th:href="@{/employees/{id}/edit(id=${emp.id})}">
                        Edit
                    </a>

                    <form th:action="@{/employees/{id}/delete(id=${emp.id})}"
                          method="post"
                          style="display:inline"
                          onsubmit="return confirm('Delete this employee?')">
                        <button type="submit" class="danger">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="7">No employees found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
