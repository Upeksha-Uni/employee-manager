
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 30px auto;
            padding: 0 16px;
            background: #f4f6f9;
        }

        form {
            background: white;
            padding: 22px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 14px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
        }

        button, a {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 14px;
            background: #243b64;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        .error {
            color: #b42318;
        }
    </style>
</head>

<body>
<h1>Edit Employee</h1>

<form th:action="@{/employees/{id}/update(id=${employee.id})}"
      th:object="${employee}"
      method="post">

    <label for="fullName">Full Name</label>
    <input id="fullName" type="text"
           th:field="*{fullName}" required>
    <div class="error" th:errors="*{fullName}"></div>

    <label for="email">Email</label>
    <input id="email" type="email"
           th:field="*{email}" required>
    <div class="error" th:errors="*{email}"></div>

    <label for="phone">Phone (10 digits)</label>
    <input id="phone" type="tel"
           th:field="*{phone}"
           pattern="[0-9]{10}" required>
    <div class="error" th:errors="*{phone}"></div>

    <label for="department">Department</label>
    <input id="department" type="text"
           th:field="*{department}" required>
    <div class="error" th:errors="*{department}"></div>

    <label for="salary">Salary</label>
    <input id="salary" type="number"
           th:field="*{salary}"
           min="0.01" step="0.01" required>
    <div class="error" th:errors="*{salary}"></div>

    <button type="submit">Update Employee</button>
    <a th:href="@{/employees}">Cancel</a>
</form>
</body>
</html>
